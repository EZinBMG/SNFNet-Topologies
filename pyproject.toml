[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core-arm-network-simulations"
version = "1.0.0"
description = "Reproducible mechanical simulations of random and core-arm networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.5",
    "scipy==1.17.0",
    "pandas==2.2.3",
    "networkx==3.5",
]

[project.scripts]
corearm = "corearm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
corearm = ["data/*.json", "data/networks/*.json", "data/reference/*.csv"]
